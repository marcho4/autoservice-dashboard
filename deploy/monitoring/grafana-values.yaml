# Grafana, чарт grafana-community/grafana.
# Источники данных создаются из этого файла при старте пода, в UI их заводить не нужно.
plugins:
  - victoriametrics-logs-datasource

# Дашборды из dashboards/: install.sh кладёт их в ConfigMap grafana-dashboards, Grafana перечитывает их сама.
# Правки в UI пропадают при рестарте пода, поэтому меняйте JSON в репозитории.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Автосервис
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
dashboardsConfigMaps:
  default: grafana-dashboards

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # VictoriaMetrics отвечает по Prometheus API, MetricsQL (histogram_share, WITH) проходит как есть.
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics-single-server.autoservice.svc.cluster.local:8428
        isDefault: true
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://vlogs-victoria-logs-single-server.logging.svc.cluster.local:9428
