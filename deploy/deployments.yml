---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: autoservice
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - image: backend-t-academy:latest
        imagePullPolicy: IfNotPresent
        name: backend
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        env:
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)?sslmode=disable"
      initContainers:
        - name: migrations
          image: backend-t-academy:latest
          imagePullPolicy: IfNotPresent
          command: ["./app", "migrate"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: autoservice
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - image: frontend-t-academy:latest
        imagePullPolicy: IfNotPresent
        name: frontend
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          valueFrom: 
            configMapKeyRef:
              name: app-config
              key: FRONTEND_PORT
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: HTTP_PORT
        - name: BACKEND_URL
          value: "http://backend:$(API_PORT)"
        - name: COOKIE_SECURE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: COOKIE_SECURE
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: autoservice
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
        - name: postgres-explore
          image: prometheuscommunity/postgres-exporter:v0.20.1
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/autoservice?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_PASSWORD
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: autoservice
  name: prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - image: backend-t-academy:latest
        imagePullPolicy: IfNotPresent
        name: prober
        command: ["./app", "probe"]
        ports:
        - containerPort: 8081
        env:
        - name: HTTP_PORT
          value: "8081"
        - name: PROBER_TARGETS
          value: "backend=http://backend:8080/readyz,frontend=http://frontend:3000/healthz"
        - name: PROBER_INTERVAL
          value: "15s"
        - name: PROBER_TIMEOUT
          value: "5s"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
---