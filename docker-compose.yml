services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    image: autoservice-api:${APP_VERSION:-dev}
    command: ["./app", "migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: autoservice-api:${APP_VERSION:-dev}
    environment:
      HTTP_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      BOT_API_KEY: ${BOT_API_KEY}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  web:
    build: ./frontend
    image: autoservice-web:${APP_VERSION:-dev}
    environment:
      PORT: ${WEB_PORT}
      BACKEND_URL: http://api:${API_PORT}
      COOKIE_SECURE: ${COOKIE_SECURE}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    depends_on:
      - api

volumes:
  pgdata:
